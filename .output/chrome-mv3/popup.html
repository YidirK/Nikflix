<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nikflix | Bypass the account-sharing restrictions</title>

<body>
<header data-i18n="header">🎬 Nikflix</header>

<div class="update-message" id="update-message" data-i18n="updateAvailable">
    🎉 New version available! Please update your extension.
</div>

<main>

    <button id="coffee-btn" data-i18n="buyMeCoffee">☕ Buy me a coffee</button>

    <div class="bug-text" data-i18n="bugInfoText">
        If you have a bug, use the button with this icon in the controller. (or click here)

</div>

<div class="contact-info" id="contact-info">
    <div class="contact-icon">
        <svg viewBox="0 0 24 24" fill="none" height="20" xmlns="http://www.w3.org/2000/svg">
            <path d="M1.5 8.67V18C1.5 20.5 3.5 22.5 6 22.5H18C20.5 22.5 22.5 20.5 22.5 18V8.67L13.42 15.64C12.58 16.26 11.42 16.26 10.58 15.64L1.5 8.67Z" fill="#3b82f6" />

        </svg>
    </div>
    <div class="contact-text">
        <div data-i18n="contactDeveloper">Want to contact the developer?</div>
        <div class="contact-email">yidirk@hergol.me</div>
    </div>
</div>

<div class="marquee-container">
    <div class="marquee-text">
        <span data-i18n="thanksContributors">🙌 Thanks to Contributors :</span>
        <span id="contributors"></span>
    </div>
</div>

<!-- ── Block mode selector ── -->
<div class="mode-section">
    <div class="mode-section-title" data-i18n="blockingModeSection">🔒 Blocking Mode</div>
    <div class="mode-cards">
        <button class="mode-card" id="mode-css" data-mode="css">
            <div class="mode-card-icon">🎨</div>
            <div class="mode-card-body">
                <div class="mode-card-name" data-i18n="cssBlockTitle">CSS Block</div>
                <div class="mode-card-desc" data-i18n="cssModeDescPopup">Hides the modal · Nikflix controller</div>
            </div>
            <div class="mode-card-check" id="check-css">✓</div>
        </button>
        <button class="mode-card" id="mode-api" data-mode="api">
            <div class="mode-card-icon">🔒</div>
            <div class="mode-card-body">
                <div class="mode-card-name" data-i18n="apiBlockTitle">API Block</div>
                <div class="mode-card-desc" data-i18n="apiModeDescPopup">Blocks GraphQL · Netflix controller</div>
            </div>
            <div class="mode-card-check" id="check-api">✓</div>
        </button>
    </div>
</div>


<div class="controller-toggle" id="controller-toggle-wrap" style="margin-bottom: 4px;">
    <span class="toggle-label" data-i18n="controllerLabel">Controller</span>
    <label class="toggle-switch">
        <input type="checkbox" id="controllerToggle" checked>
        <span class="slider"></span>
    </label>
    <span class="status-text" id="statusText" data-i18n="statusEnabled">Enable</span>
</div>

<footer>
    <span data-i18n="madeWith">Made with ❤️ by</span>
    <a href="https://github.com/YidirK" target="_blank">@yidirk</a> •
    <span id="version"></span>
</footer>

</body>
</html>
